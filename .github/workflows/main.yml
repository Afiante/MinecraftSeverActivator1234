name: Run Minecraft Server

on:
  repository_dispatch:
    types: [start-server] # Crucial mismatch fix!

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Server Files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Install Playit.gg for Networking
        run: |
          sudo curl -o /usr/local/bin/playit https://playit.gg
          sudo chmod +x /usr/local/bin/playit

      - name: Start Minecraft Server
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo "eula=true" > eula.txt
          playit --secret "$PLAYIT_SECRET" & 
          java -Xmx4G -Xms8G -jar server.jar nogui
