name: Run Minecraft Server

on:
  repository_dispatch:
    types: [start-server]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v4

      - name: Install Runtime Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Provision Playit Tunnel Agent
        run: |
          sudo curl -o /usr/local/bin/playit https://playit.gg
          sudo chmod +x /usr/local/bin/playit

      - name: Force Download and Extract PaperMC Folder
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          
          # 📥 ✅ FIXED: Uses the verified raw download stream URL to pull your 380MB PaperMc server zip package cleanly
          curl -L -o PaperMC.zip "https://mediafire.com"
          
          if [ -f "PaperMC.zip" ]; then 
            unzip -o PaperMC.zip
            echo "✅ Whole PaperMC server folder extracted successfully!"
          else
            echo "❌ Error: Failed to download the server folder archive package."
          fi

      - name: Execute Live Server Deployment Core
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          # Step inside your extracted server folder where paper.jar lives
          cd PaperMc
          
          echo "eula=true" > eula.txt
          
          # Initialize background network tunnels securely
          playit --secret "$PLAYIT_SECRET" & 
          
          # Launch your primary Paper jar configuration structure cleanly
          java -Xmx6G -Xms6G -jar paper.jar nogui
