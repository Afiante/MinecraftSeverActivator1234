name: 24/7 Cloud Minecraft Engine & Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v4

      - name: Install Runtime Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Provision Playit Tunnel Agent
        run: |
          sudo curl -o /usr/local/bin/playit https://playit.gg
          sudo chmod +x /usr/local/bin/playit

      - name: Force Download and Extract PaperMC Folder
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          
          # 📥 ✅ FIXED DIRECT LINK: Uses Dropbox's raw usercontent subdomain layout to bypass bot blocks safely
          curl -L -o PaperMC.zip "https://dropboxusercontent.com"
          
          if [ -f "PaperMC.zip" ]; then 
            unzip -o PaperMC.zip
            echo "✅ Server files unpacked successfully!"
          else
            echo "❌ Error: Failed to extract server zip archive pack."
            exit 1
          fi

      - name: Initialize Discord Bot & Server Loop
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          # 1. Write the bot code into a clean file right inside the cloud machine
          cat << 'EOF' > run_bot.py
          import os
          import discord
          from discord.ext import commands

          intents = discord.Intents.default()
          intents.message_content = True
          bot = commands.Bot(command_prefix="!", intents=intents)

          @bot.event
          async def on_ready():
              print(f"🤖 Cloud Bot is online inside GitHub Actions as: {bot.user}")

          @bot.command()
          async def status(ctx):
              await ctx.send("🟢 **Server Status:** The cloud console is active and PaperMC is running in the background!")

          bot.run(os.getenv("DISCORD_TOKEN"))
          EOF

          # 2. Boot up your Discord bot in the background so it stays online 24/7
          pip install discord.py
          python3 run_bot.py &
          echo "🚀 Discord control bridge initialized successfully!"

          # 3. Step inside your folder and fire up the main Paper engine
          # Note: If your zip extracted with lowercase 'c', it matches perfectly.
          if [ -d "PaperMC" ]; then cd PaperMC; else cd PaperMc; fi
          
          echo "eula=true" > eula.txt
          playit --secret "$PLAYIT_SECRET" & 
          java -Xmx6G -Xms6G -jar paper.jar nogui
