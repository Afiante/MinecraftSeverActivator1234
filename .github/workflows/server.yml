name: 24/7 Cloud Minecraft Engine & Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v4

      - name: Install Runtime Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Provision Playit Tunnel Agent
        run: |
          sudo curl -o /usr/local/bin/playit https://playit.gg
          sudo chmod +x /usr/local/bin/playit

      - name: Force Download and Extract PaperMC Folder
        run: |
          sudo apt-get update && sudo apt-get install -y unzip python3-pip
          pip3 install beautifulsoup4 requests --break-system-packages

          # 📡 ADVANCED PYTHON SCRAPER: Solves MediaFire's dynamic JavaScript token layout blocks
          python3 -c "
          import requests
          from bs4 import BeautifulSoup
          import re
          import sys

          try:
              headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
              res = requests.get('https://mediafire.com', headers=headers)
              soup = BeautifulSoup(res.text, 'html.parser')
              
              # Locate the exact physical download button container
              a_tag = soup.find('a', {'id': 'downloadButton'})
              if a_tag and a_tag.get('href'):
                  print(a_tag.get('href').strip())
                  sys.exit(0)
                  
              # Fallback layout regex pattern matching
              links = re.findall(r'href=\"(https?://download[^ \"]+)\"', res.text)
              if links:
                  print(links[0].strip())
                  sys.exit(0)
                  
              print('ERROR', file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          " > live_link.txt

          FINAL_URL=$(cat live_link.txt)
          echo "📡 Found live file server endpoint: $FINAL_URL"

          if [ "$FINAL_URL" = "ERROR" ] || [ -z "$FINAL_URL" ]; then
            print "❌ Critical Error: MediaFire shield blocked account layout parameters."
            exit 1
          fi

          # Pulls down your 380MB PaperMc server zip package cleanly
          curl -L -o PaperMC.zip "$FINAL_URL"
          
          if [ -f "PaperMC.zip" ]; then 
            unzip -o PaperMC.zip
            echo "✅ Server files unpacked successfully!"
          else
            echo "❌ Error: Failed to extract server zip archive pack."
            exit 1
          fi

      - name: Initialize Discord Bot & Server Loop
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          # 1. Write the bot code into a clean file right inside the cloud machine
          cat << 'EOF' > run_bot.py
          import os
          import discord
          from discord.ext import commands

          intents = discord.Intents.default()
          intents.message_content = True
          bot = commands.Bot(command_prefix="!", intents=intents)

          @bot.event
          async def on_ready():
              print(f"🤖 Cloud Bot is online inside GitHub Actions as: {bot.user}")

          @bot.command()
          async def status(ctx):
              await ctx.send("🟢 **Server Status:** The cloud console is active and PaperMC is running in the background!")

          bot.run(os.getenv("DISCORD_TOKEN"))
          EOF

          # 2. Boot up your Discord bot in the background so it stays online 24/7
          python3 run_bot.py &
          print "🚀 Discord control bridge initialized successfully!"

          # 3. Step inside your folder and fire up the main Paper engine
          cd PaperMc
          echo "eula=true" > eula.txt
          playit --secret "$PLAYIT_SECRET" & 
          java -Xmx6G -Xms6G -jar paper.jar nogui
